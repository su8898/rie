name: Load database snapshot

# Manual only. Copies the working data of a local SQLite rie.db into the deployed PostgreSQL
# database (db/copy_sqlite.py) — claims, determinations, cases, payments, workflow history.
# Users and the reference tables loaded from reference.db are not touched.
#
# First copy the file up, from your machine:
#     scp rie.db USER@SERVER:/opt/rie/refdata/rie.db
#
# It refuses to run when the deployed database already holds claims, and the copy is a single
# transaction, so it lands completely or not at all.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "load snapshot" to confirm'
        required: true

concurrency:
  group: deploy-rie-production
  cancel-in-progress: false

jobs:
  load:
    runs-on: ubuntu-latest
    steps:
      - name: Check the confirmation
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: |
          [ "$CONFIRM" = "load snapshot" ] || { echo 'x type exactly: load snapshot'; exit 1; }

      - name: Setup SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_PASSPHRASE: ${{ secrets.SSH_PASSPHRASE }}
          DROPLET_HOST: ${{ secrets.DROPLET_HOST }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "$DROPLET_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          eval "$(ssh-agent -s)"
          if [ -n "${SSH_PASSPHRASE:-}" ]; then
            PASS_HELPER=~/.ssh/askpass.sh
            printf '%s\n' '#!/usr/bin/env bash' 'echo "$SSH_PASSPHRASE"' > "$PASS_HELPER"
            chmod 700 "$PASS_HELPER"
            DISPLAY=:0 SSH_ASKPASS="$PASS_HELPER" setsid -f ssh-add ~/.ssh/id_deploy </dev/null
          else
            ssh-add ~/.ssh/id_deploy
          fi
          echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK" >> "$GITHUB_ENV"

      - name: Copy the snapshot into the database
        env:
          DROPLET_HOST: ${{ secrets.DROPLET_HOST }}
          DROPLET_USER: ${{ secrets.DROPLET_USER }}
        run: |
          set -euo pipefail
          USER_ON_HOST="${DROPLET_USER:-root}"
          SSH_OPTS="-o StrictHostKeyChecking=no -o IdentitiesOnly=yes -i ~/.ssh/id_deploy"

          ssh $SSH_OPTS "${USER_ON_HOST}@${DROPLET_HOST}" bash -s <<'ENDSSH'
            set -euo pipefail
            cd /opt/rie
            COMPOSE="docker-compose.prod.yml"

            if [ ! -f refdata/rie.db ]; then
              echo "x /opt/rie/refdata/rie.db is not on the server. Copy it up first:"
              echo "      scp rie.db USER@SERVER:/opt/rie/refdata/rie.db"
              exit 1
            fi

            # The script itself refuses if the database already holds claims.
            docker compose -f "$COMPOSE" run --rm -T init python db/copy_sqlite.py /refdata/rie.db

            echo "ok  claims now in the database: $(docker compose -f "$COMPOSE" exec -T db                  psql -U rie -d rie -tAc 'select count(*) from claims')"
          ENDSSH
